name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: 'URL base da API (ex: https://seu-app.onrender.com)'
        required: false
        default: ''
  push:
    branches: [main]
    paths:
      - 'app-web/**'
      - 'android/**'
      - 'scripts/build_web.js'
      - 'scripts/sync_android.js'
      - 'capacitor.config.ts'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Web & Sync Android Assets
        env:
          VITE_API_BASE_URL: ${{ github.event.inputs.api_base_url || vars.VITE_API_BASE_URL || '' }}
        run: |
          npm run build:web
          node scripts/sync_android.js

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Assemble Debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: autonmax-vnext-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
