<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>AUTON.MAX — ADU Consumer</title>
  <style>
    :root {
      --bg: #0a0e12; --panel: #12181f; --border: #1c2530;
      --accent: #5eead4; --text: #f1f5f9; --muted: #94a3b8;
      --user: #1e3a5f; --bot: #1a2330;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Segoe UI", system-ui, sans-serif;
      background: var(--bg); color: var(--text);
      height: 100dvh; display: flex; flex-direction: column;
    }
    header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 0.75rem 1rem; background: var(--panel); border-bottom: 1px solid var(--border);
    }
    header .brand { font-weight: 600; font-size: 0.95rem; }
    header .brand span { color: var(--accent); }
    #balance-btn {
      background: #1a2330; border: 1px solid var(--border); color: var(--text);
      border-radius: 999px; padding: 0.35rem 0.75rem; font-size: 0.8rem; cursor: pointer;
      display: flex; align-items: center; gap: 0.35rem;
    }
    #chat {
      flex: 1; overflow-y: auto; padding: 1rem; display: flex; flex-direction: column; gap: 0.65rem;
    }
    .msg {
      max-width: 85%; padding: 0.7rem 0.9rem; border-radius: 12px; font-size: 0.9rem; line-height: 1.4;
    }
    .msg.bot { align-self: flex-start; background: var(--bot); border: 1px solid var(--border); }
    .msg.user { align-self: flex-end; background: var(--user); }
    .hitl-card {
      align-self: flex-start; background: #1a2a1a; border: 1px solid #2d5a3d;
      border-radius: 12px; padding: 0.9rem; max-width: 90%;
    }
    .hitl-card h3 { font-size: 0.8rem; color: var(--accent); margin-bottom: 0.35rem; }
    .hitl-card .actions { margin-top: 0.6rem; display: flex; gap: 0.5rem; }
    .hitl-card button {
      flex: 1; padding: 0.45rem; border-radius: 8px; border: none; cursor: pointer; font-weight: 600;
    }
    .hitl-card .confirm { background: var(--accent); color: #0a0e12; }
    .hitl-card .reject { background: #3d1f1f; color: #fca5a5; }
    footer {
      padding: 0.65rem; background: var(--panel); border-top: 1px solid var(--border);
      display: flex; gap: 0.5rem; align-items: center;
    }
    footer input {
      flex: 1; background: #0d131a; border: 1px solid var(--border); border-radius: 999px;
      padding: 0.6rem 1rem; color: var(--text); font-size: 0.9rem; outline: none;
    }
    footer button {
      width: 40px; height: 40px; border-radius: 50%; border: none; background: var(--accent);
      color: #0a0e12; font-size: 1rem; cursor: pointer;
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">AUTON.<span>MAX</span> ADU</div>
    <button id="balance-btn" type="button" title="Alternar privacidade">
      <span>👁️</span>
      <span id="balance-label">R$ 0,00</span>
    </button>
  </header>
  <div id="chat"></div>
  <footer>
    <button type="button" title="Voz" aria-label="Voz">🎤</button>
    <input id="input" type="text" placeholder="Digite sua mensagem…" autocomplete="off" />
    <button id="send" type="button" aria-label="Enviar">➤</button>
  </footer>
  <script>
    // Shell only — logic lives in ConsumerWallet / HitlApprovalGuard modules when bundled
    const chat = document.getElementById('chat');
    const input = document.getElementById('input');
    const sendBtn = document.getElementById('send');
    const balanceBtn = document.getElementById('balance-btn');
    const balanceLabel = document.getElementById('balance-label');

    let hidden = false;
    let pix = 250;
    let maxc = 12.5;

    function renderBalance() {
      balanceLabel.textContent = hidden ? '••••••' : ('R$ ' + pix.toFixed(2).replace('.', ','));
    }

    balanceBtn.addEventListener('click', () => {
      hidden = !hidden;
      renderBalance();
    });
    renderBalance();

    function addMsg(text, who) {
      const el = document.createElement('div');
      el.className = 'msg ' + who;
      el.textContent = text;
      chat.appendChild(el);
      chat.scrollTop = chat.scrollHeight;
    }

    function addHitlCard(actionId, title, desc) {
      const el = document.createElement('div');
      el.className = 'hitl-card';
      el.dataset.actionId = actionId;
      el.innerHTML =
        '<h3>' + title + '</h3><p>' + desc + '</p>' +
        '<div class="actions">' +
        '<button class="confirm" type="button">Confirmar</button>' +
        '<button class="reject" type="button">Recusar</button></div>';
      el.querySelector('.confirm').onclick = () => {
        addMsg('Ação confirmada ✓', 'bot');
        el.remove();
      };
      el.querySelector('.reject').onclick = () => {
        addMsg('Ação cancelada', 'bot');
        el.remove();
      };
      chat.appendChild(el);
      chat.scrollTop = chat.scrollHeight;
    }

    function handleSend() {
      const text = input.value.trim();
      if (!text) return;
      addMsg(text, 'user');
      input.value = '';
      // Demo: payment-like phrase triggers HITL card
      if (/pagar|transferir|pix/i.test(text)) {
        addMsg('Preciso da sua confirmação para continuar.', 'bot');
        addHitlCard('demo-1', 'Confirmar PIX', 'Enviar R$ 50,00');
      } else {
        addMsg('Entendi. Posso ajudar com saldo, PIX ou MAXCoin.', 'bot');
      }
    }

    sendBtn.addEventListener('click', handleSend);
    input.addEventListener('keydown', (e) => { if (e.key === 'Enter') handleSend(); });

    addMsg('Olá! Sou o ADU AUTON.MAX. Como posso ajudar?', 'bot');
  </script>
</body>
</html>
