<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AUTON.MAX — Surface Realtime UI</title>
  <style>
    :root {
      --bg: #0b0f14;
      --panel: #141a22;
      --accent: #3dffa8;
      --text: #e8eef5;
      --muted: #8b9bb0;
      --danger: #ff5c7a;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Segoe UI", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 1rem 1.5rem;
      background: var(--panel);
      border-bottom: 1px solid #1e2836;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    header h1 { font-size: 1.1rem; font-weight: 600; letter-spacing: 0.04em; }
    header h1 span { color: var(--accent); }
    #status {
      font-size: 0.75rem;
      padding: 0.25rem 0.6rem;
      border-radius: 999px;
      background: #1a2330;
      color: var(--muted);
    }
    #status.online { color: var(--accent); }
    main {
      flex: 1;
      padding: 1.25rem;
      max-width: 720px;
      width: 100%;
      margin: 0 auto;
    }
    .feed {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }
    .card {
      background: var(--panel);
      border: 1px solid #1e2836;
      border-radius: 10px;
      padding: 0.9rem 1rem;
      animation: fadeIn 0.2s ease;
    }
    .card .topic {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--accent);
      margin-bottom: 0.35rem;
    }
    .card .payload {
      font-size: 0.9rem;
      color: var(--text);
      word-break: break-word;
    }
    .card .meta {
      margin-top: 0.4rem;
      font-size: 0.7rem;
      color: var(--muted);
    }
    .rejected { border-color: var(--danger); }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: none; }
    }
  </style>
</head>
<body>
  <header>
    <h1>AUTON.<span>MAX</span> Surface</h1>
    <div id="status">conectando…</div>
  </header>
  <main>
    <div class="feed" id="feed"></div>
  </main>
  <script>
    /**
     * Browser shell — uses native WebSocket.
     * HMAC validation is performed server-side by SurfaceBridge;
     * client still checks shape and size (Zero UI Blocking).
     */
    const BRIDGE_URL = 'ws://127.0.0.1:9876';
    const MAX_FRAME = 256 * 1024;
    const statusEl = document.getElementById('status');
    const feed = document.getElementById('feed');

    function addCard(topic, payload, meta, rejected) {
      const el = document.createElement('div');
      el.className = 'card' + (rejected ? ' rejected' : '');
      el.innerHTML =
        '<div class="topic">' + topic + '</div>' +
        '<div class="payload">' + JSON.stringify(payload, null, 0) + '</div>' +
        '<div class="meta">' + (meta || '') + '</div>';
      feed.prepend(el);
    }

    function connect() {
      const ws = new WebSocket(BRIDGE_URL);
      ws.onopen = () => {
        statusEl.textContent = 'online';
        statusEl.classList.add('online');
        ['ledger.update', 'hitl.request', 'whatsapp.message'].forEach((t) => {
          ws.send(JSON.stringify({ action: 'subscribe', topic: t }));
        });
      };
      ws.onmessage = (ev) => {
        if (typeof ev.data === 'string' && ev.data.length > MAX_FRAME) return;
        let data;
        try { data = JSON.parse(ev.data); } catch { return; }
        if (data.topic && data.payload !== undefined) {
          addCard(data.topic, data.payload, data.eventId || '', false);
        }
      };
      ws.onclose = () => {
        statusEl.textContent = 'offline — reconectando…';
        statusEl.classList.remove('online');
        setTimeout(connect, 2000);
      };
      ws.onerror = () => { /* onclose will fire */ };
    }
    connect();
  </script>
</body>
</html>
