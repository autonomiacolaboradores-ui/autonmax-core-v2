# render.free.yaml — AUTONMAX vNext (Modo Free: US$ 0/mês — Testes, Demo & Homologação)
# ATENÇÃO: Plano Free possui disco efêmero e hiberna após 15 min sem requisições HTTP.
services:
  - type: web
    name: autonmax-vnext-free
    runtime: node
    region: oregon
    plan: free
    buildCommand: npm ci --omit=dev && npm run build:web
    startCommand: node bin/start.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 24.19.0
      - key: NODE_ENV
        value: production
      - key: SERVE_STATIC_UI
        value: "true"
      - key: NODE_OPTIONS
        value: --max-old-space-size=384
      - key: KEEP_ALIVE_INTERVAL_MS
        value: "420000"
      - key: WA_WATCHDOG_INTERVAL_MS
        value: "60000"
      - key: JWT_TTL_SECONDS
        value: "2592000"
      - key: DB_PATH
        value: ./workspace/autonmax.db
      - key: SESSIONS_DIR
        value: ./workspace/sessions
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_DISPLAY_NAME
        sync: false
      - key: VOICE_STT_DRIVER
        value: cloud
      - key: VOICE_TTS_DRIVER
        value: off
      - key: DEBOUNCE_WINDOW_MS
        value: "2500"
      - key: MAX_LINES_PER_PARTNER
        value: "2"
      - key: JWT_SECRET
        generateValue: true
      - key: INTERNAL_API_KEY
        generateValue: true
      - key: WEBHOOK_SIGNING_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: OPENAI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
